name: Process Saved Data to Stocks

on:
  workflow_dispatch: # केवल मैनुअल बटन दबाकर चलाने के लिए

jobs:
  process-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Process Existing Data from Data Folder
        run: python split_fo_equity_stocks.py

      - name: Save Individual Stocks to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Organized existing data into stocks folder [skip ci]" && git push)
